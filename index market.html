
<script>
(() => {
'use strict';

const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('en-US', {
  minimumFractionDigits: 2,
  maximumFractionDigits: 2
});

const SPOT_URL = 'https://xaus.com/api/v1/spot?compact=1';
const CHART_URL = 'https://xaus.com/api/v1/chart?symbol=xau&range=1d&interval=1m';

let candles = [];
let lastSignal = 'WAIT';
let busy = false;

function setStatus(message, ok = false) {
  $('feed').textContent = message;
  $('feed').style.color = ok ? '#2ef2a3' : '#ffd66b';
}

function ema(values, period) {
  if (!values.length) return [];
  const k = 2 / (period + 1);
  const out = [values[0]];
  for (let i = 1; i < values.length; i++) {
    out.push(values[i] * k + out[i - 1] * (1 - k));
  }
  return out;
}

function rsi(values, period = 14) {
  if (values.length <= period) return null;
  let gains = 0, losses = 0;
  for (let i = values.length - period; i < values.length; i++) {
    const change = values[i] - values[i - 1];
    if (change > 0) gains += change;
    else losses -= change;
  }
  if (losses === 0) return gains === 0 ? 50 : 100;
  return 100 - 100 / (1 + gains / losses);
}

function normalizeCandles(data) {
  const rows = Array.isArray(data) ? data :
    data.points || data.candles || data.data || [];

  return rows.map(x => {
    let t = Number(x.t ?? x.time ?? x.timestamp);
    if (!Number.isFinite(t)) return null;
    if (t < 1e12) t *= 1000;

    const o = Number(x.o ?? x.open);
    const h = Number(x.h ?? x.high);
    const l = Number(x.l ?? x.low);
    const c = Number(x.c ?? x.close);

    if (![o, h, l, c].every(Number.isFinite)) return null;
    return { t, o, h, l, c };
  }).filter(Boolean)
    .sort((a, b) => a.t - b.t);
}

function draw(e9, e21) {
  const canvas = $('chart');
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  if (!rect.width || !rect.height || !candles.length) return;

  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);

  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const w = rect.width, h = rect.height;
  const view = candles.slice(-48);
  const lows = view.map(x => x.l);
  const highs = view.map(x => x.h);
  const min = Math.min(...lows);
  const max = Math.max(...highs);
  const range = max - min || 1;
  const y = p => h - 12 - (p - min) / range * (h - 24);
  const step = w / view.length;
  const cw = Math.max(2, step * .5);

  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = '#1b2c4e';
  for (let i = 0; i < 5; i++) {
    const yy = 10 + i * (h - 20) / 4;
    ctx.beginPath();
    ctx.moveTo(0, yy);
    ctx.lineTo(w, yy);
    ctx.stroke();
  }

  view.forEach((c, i) => {
    const x = i * step + step / 2;
    const color = c.c >= c.o ? '#2ef2a3' : '#ff537d';
    ctx.strokeStyle = ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, y(c.h));
    ctx.lineTo(x, y(c.l));
    ctx.stroke();
    ctx.fillRect(
      x - cw / 2,
      y(Math.max(c.o, c.c)),
      cw,
      Math.max(1, y(Math.min(c.o, c.c)) - y(Math.max(c.o, c.c)))
    );
  });

  const start = candles.length - view.length;
  [[e9, '#37d7ff'], [e21, '#a58cff']].forEach(([arr, color]) => {
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    view.forEach((c, i) => {
      const x = i * step + step / 2;
      const yy = y(arr[start + i]);
      if (i === 0) ctx.moveTo(x, yy);
      else ctx.lineTo(x, yy);
    });
    ctx.stroke();
  });
}

function riskCalc() {
  const balance = Math.max(0, Number($('balance').value) || 0);
  const risk = Number($('risk').value) || 1;
  const dist = Math.max(.01, Number($('distance').value) || 2.5);
  const cash = balance * risk / 100;
  $('cash').textContent = '$' + cash.toFixed(2);
  $('size').textContent = (cash / dist).toFixed(2) + ' unit';
}

function log(title, detail) {
  const history = $('history');
  if (history.classList.contains('small')) {
    history.className = '';
    history.textContent = '';
  }
  const row = document.createElement('div');
  row.className = 'history-item';
  const a = document.createElement('span');
  a.textContent = title + ' · ' + new Date().toLocaleTimeString();
  const b = document.createElement('b');
  b.textContent = detail;
  row.append(a, b);
  history.prepend(row);
}

function notify(title, body) {
  if ('Notification' in window &&
      Notification.permission === 'granted') {
    try { new Notification(title, { body }); } catch (_) {}
  }
}

function calculate() {
  if (candles.length < 22) {
    $('signal').textContent = 'WAIT';
    $('signalNote').textContent = 'Menunggu data candle M1 yang mencukupi.';
    return;
  }

  const closes = candles.map(c => c.c);
  const e9 = ema(closes, 9);
  const e21 = ema(closes, 21);
  const rv = rsi(closes);
  const i = closes.length - 1;
  const c = candles[i];

  const signal =
    e9[i] > e21[i] && rv !== null && rv >= 54 && c.c > c.o ? 'BUY' :
    e9[i] < e21[i] && rv !== null && rv <= 46 && c.c < c.o ? 'SELL' :
    'WAIT';

  $('ema9').textContent = fmt(e9[i]);
  $('ema21').textContent = fmt(e21[i]);
  $('rsi').textContent = rv === null ? '—' : rv.toFixed(1);
  $('time').textContent = new Date(c.t).toLocaleTimeString('ms-MY', {
    hour: '2-digit', minute: '2-digit'
  });

  $('signal').textContent = signal;
  $('signal').className = 'signal ' +
    (signal === 'BUY' ? 'buy' : signal === 'SELL' ? 'sell' : 'wait');

  $('direction').textContent =
    signal === 'WAIT' ? 'Menunggu setup' : signal + ' · data luar';

  const dist = Math.max(.5, Number($('distance').value) || 2.5);
  const sgn = signal === 'BUY' ? 1 : -1;
  $('entry').textContent = signal === 'WAIT' ? '—' : fmt(c.c);
  $('sl').textContent = signal === 'WAIT' ? '—' : fmt(c.c - sgn * dist);
  $('tp1').textContent = signal === 'WAIT' ? '—' : fmt(c.c + sgn * dist);
  $('tp2').textContent = signal === 'WAIT' ? '—' : fmt(c.c + sgn * dist * 1.5);
  $('tp3').textContent = signal === 'WAIT' ? '—' : fmt(c.c + sgn * dist * 2);

  $('signalNote').textContent =
    'Signal dikira daripada candle terakhir yang diterima. ' +
    'Data luar mungkin lewat dan tidak semestinya sama dengan Valetax.';

  if (signal !== 'WAIT' && signal !== lastSignal) {
    log(signal + ' SIGNAL', fmt(c.c));
    if ($('signalAlert').checked) {
      notify('BLUEGOLD M1 — ' + signal,
        'Paras candle sumber luar: ' + fmt(c.c));
    }
  }

  lastSignal = signal;
  draw(e9, e21);
  riskCalc();
}

async function loadData() {
  if (busy) return;
  busy = true;
  setStatus('MEMUAT DATA…');

  try {
    const [spotRes, chartRes] = await Promise.all([
      fetch(SPOT_URL, { cache: 'no-store' }),
      fetch(CHART_URL, { cache: 'no-store' })
    ]);

    if (!spotRes.ok) throw new Error('Harga spot HTTP ' + spotRes.status);
    if (!chartRes.ok) throw new Error('Carta M1 HTTP ' + chartRes.status);

    const spot = await spotRes.json();
    const chart = await chartRes.json();

    const price = Number(spot.spot_usd_oz ?? spot.xau?.price);
    if (!Number.isFinite(price) || price <= 0) {
      throw new Error('Format harga spot tidak dikenali');
    }

    const updated = spot.price_as_of || spot.updated_at;
    $('price').textContent = fmt(price);
    $('time').textContent = candles.length
      ? new Date(candles[candles.length - 1].t).toLocaleTimeString('ms-MY', {
          hour: '2-digit', minute: '2-digit'
        })
      : '—';

    const age = updated ? Math.max(0, Math.round(
      (Date.now() - new Date(updated).getTime()) / 1000
    )) : null;

    const state = spot.data_state?.status || 'unknown';
    $('signalNote').textContent =
      'Spot XAUS: ' + state +
      (age !== null && Number.isFinite(age) ? ' · umur data kira-kira ' + age + 's' : '') +
      '. Harga rujukan, bukan sebut harga Valetax.';

    const received = normalizeCandles(chart);
    if (received.length < 22) {
      throw new Error('API tidak memulangkan candle M1 yang mencukupi');
    }

    // Jangan guna candle yang masih berjalan untuk mengira signal.
    const now = Date.now();
    const completed = received.filter(c => c.t + 60000 <= now + 1000);
    if (completed.length < 22) {
      throw new Error('Belum cukup candle M1 yang telah ditutup');
    }

    candles = completed.slice(-180);
    setStatus(
      state === 'stale' ? 'SPOT STALE' : 'SPOT + CARTA M1',
      state === 'fresh'
    );
    calculate();

  } catch (err) {
    setStatus('DATA GAGAL');
    $('signal').textContent = 'WAIT';
    $('signal').className = 'signal wait';
    $('direction').textContent = 'Tiada pengesahan';
    $('signalNote').textContent =
      'Data tidak dapat disahkan: ' + err.message +
      '. Tiada harga simulasi digunakan. Cuba muat semula kemudian.';
    console.error('BLUEGOLD data error:', err);
  } finally {
    busy = false;
  }
}

$('enable').addEventListener('click', async () => {
  if (!('Notification' in window)) {
    $('permission').textContent = 'Tidak disokong';
    return;
  }
  try {
    const p = await Notification.requestPermission();
    $('permission').textContent =
      p === 'granted' ? 'Dibenarkan ketika halaman aktif' :
      p === 'denied' ? 'Disekat' : 'Belum dibenarkan';
  } catch (_) {
    $('permission').textContent = 'Tidak tersedia';
  }
});

$('test').addEventListener('click', () => {
  notify('BLUEGOLD M1 — UJIAN', 'Notifikasi ujian sahaja.');
  if (!('Notification' in window) || Notification.permission !== 'granted') {
    alert('Benarkan notifikasi dahulu. Push ketika app ditutup belum disediakan.');
  }
});

$('clear').addEventListener('click', () => {
  $('history').className = 'small';
  $('history').textContent = 'Log dikosongkan.';
});

['balance', 'risk', 'distance'].forEach(id =>
  $(id).addEventListener('input', riskCalc)
);
window.addEventListener('resize', () => {
  if (candles.length >= 22) calculate();
});

riskCalc();
loadData();
setInterval(loadData, 60000);
})();
</script>
